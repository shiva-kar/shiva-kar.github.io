<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shiva Kar — BCA student, backend development learner." />
  <meta name="author" content="Shiva Kar" />
  <title>Shiva Kar — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬛</text></svg>" />
</head>
<body>

  <nav id="navbar">
    <div class="nav-inner">
      <span class="nav-logo">shiva-kar</span>
      <ul class="nav-links" id="nav-links"></ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="Shiva_Kar_Resume.pdf" target="_blank" class="btn btn-outline" style="font-size:0.82rem;padding:0.4rem 1rem;">Resume</a>
      </div>
    </div>
  </nav>

  <section id="hero">
    <div class="container">
      <div class="hero-content">
        <p class="hero-greeting" id="hero-location"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <p class="hero-desc" id="hero-bio"></p>
        <div class="hero-btns">
          <a href="#projects" class="btn btn-primary">Projects</a>
          <a href="#contact" class="btn btn-outline">Contact</a>
        </div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="container">
      <h2 class="section-title">About</h2>
      <div class="about-text" id="about-text"></div>
    </div>
  </section>

  <section id="focus">
    <div class="container">
      <h2 class="section-title">Current Focus</h2>
      <div class="focus-grid" id="focus-grid"></div>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2 class="section-title">Skills</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>
  
  <section id="projects">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="education">
    <div class="container">
      <h2 class="section-title">Education</h2>
      <div class="edu-list" id="edu-list"></div>
    </div>
  </section>

  <section id="certifications">
    <div class="container">
      <h2 class="section-title">Certifications</h2>
      <div class="cert-list" id="cert-list"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <h2 class="section-title">Contact</h2>
      <div class="contact-inner">
        <div class="contact-text">
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>Built by <a href="https://github.com/shiva-kar">Shiva Kar</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
